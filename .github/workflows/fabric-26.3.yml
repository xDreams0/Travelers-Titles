name: Fabric 26.3

on:
  push:
    branches:
      - "26.3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Resolve unique fork version
        shell: bash
        run: |
          set -euo pipefail
          BASE_VERSION="$(sed -n 's/^version=//p' gradle.properties | head -n 1)"
          test -n "$BASE_VERSION"
          FORK_VERSION="${BASE_VERSION}+xdreams.${GITHUB_SHA:0:8}"
          echo "FORK_VERSION=$FORK_VERSION" >> "$GITHUB_ENV"
          echo "Build version: $FORK_VERSION"

      - name: Build Fabric mod
        run: ./gradlew -Pversion="${FORK_VERSION}" :Fabric:build --stacktrace --warning-mode all

      - name: Test title transition timing
        shell: bash
        run: |
          mkdir -p build/title-transition-test
          javac -d build/title-transition-test \
            Common/src/main/java/com/yungnickyoung/minecraft/travelerstitles/render/TitleTransition.java \
            tests/TitleTransitionSmokeTest.java
          java -cp build/title-transition-test TitleTransitionSmokeTest

      - name: Validate Minecraft 26.3 resources and jar
        shell: bash
        run: |
          python3 - <<'PY'
          import glob
          import json
          import zipfile
          from pathlib import Path

          root = Path(".")
          en_path = root / "Common/src/main/resources/assets/travelerstitles/lang/en_us.json"
          fr_path = root / "Common/src/main/resources/assets/travelerstitles/lang/fr_fr.json"
          tag_path = root / "Common/src/main/resources/data/travelerstitles/tags/worldgen/biome/is_underground.json"
          pack_path = root / "Common/src/main/resources/pack.mcmeta"

          en = json.loads(en_path.read_text(encoding="utf-8"))
          fr = json.loads(fr_path.read_text(encoding="utf-8"))
          assert set(en) == set(fr), f"French key parity mismatch: EN={len(en)} FR={len(fr)}"

          vanilla_biomes = {
              "badlands", "bamboo_jungle", "basalt_deltas", "beach", "birch_forest",
              "cherry_grove", "cold_ocean", "crimson_forest", "dappled_forest",
              "dark_forest", "deep_cold_ocean", "deep_dark", "deep_frozen_ocean",
              "deep_lukewarm_ocean", "deep_ocean", "desert", "dripstone_caves",
              "end_barrens", "end_highlands", "end_midlands", "eroded_badlands",
              "flower_forest", "forest", "frozen_ocean", "frozen_peaks",
              "frozen_river", "grove", "ice_spikes", "jagged_peaks", "jungle",
              "lukewarm_ocean", "lush_caves", "mangrove_swamp", "meadow",
              "mushroom_fields", "nether_wastes", "ocean", "old_growth_birch_forest",
              "old_growth_pine_taiga", "old_growth_spruce_taiga", "pale_garden",
              "plains", "river", "savanna", "savanna_plateau", "small_end_islands",
              "snowy_beach", "snowy_plains", "snowy_slopes", "snowy_taiga",
              "soul_sand_valley", "sparse_jungle", "stony_peaks", "stony_shore",
              "sulfur_caves", "sunflower_plains", "swamp", "taiga", "the_end",
              "the_void", "warm_ocean", "warped_forest", "windswept_forest",
              "windswept_gravelly_hills", "windswept_hills", "windswept_savanna",
              "wooded_badlands",
          }

          # Keep vanilla biome names delegated to biome.minecraft.* so resource
          # packs such as Icons can prepend their font glyphs without TT masking them.
          for biome in vanilla_biomes:
              name_key = f"travelerstitles.biome.minecraft.{biome}"
              assert name_key not in en, f"Vanilla biome name override blocks resource-pack compatibility: {name_key}"
              assert name_key not in fr, f"French vanilla biome override blocks resource-pack compatibility: {name_key}"

              color_key = f"{name_key}.color"
              assert color_key in en, f"Missing vanilla biome color: {color_key}"
              assert fr.get(color_key) == en[color_key], f"Locale color mismatch: {color_key}"
              color = en[color_key]
              assert isinstance(color, str) and len(color) == 6 and all(c in "0123456789abcdefABCDEF" for c in color), (
                  f"Invalid RGB color for {color_key}: {color!r}"
              )

          tag = json.loads(tag_path.read_text(encoding="utf-8"))
          values = {v for v in tag["values"] if isinstance(v, str)}
          for biome in ("minecraft:deep_dark", "minecraft:sulfur_caves"):
              assert biome in values, f"Missing underground biome tag: {biome}"

          pack = json.loads(pack_path.read_text(encoding="utf-8"))["pack"]
          assert pack["min_format"] == [97, 1], pack
          assert pack["max_format"] >= 121, pack

          jars = [
              Path(p) for p in glob.glob("Fabric/build/libs/*.jar")
              if not p.endswith("-sources.jar") and not p.endswith("-javadoc.jar")
          ]
          assert len(jars) == 1, f"Expected exactly one production jar, got: {jars}"

          jar = jars[0]
          with zipfile.ZipFile(jar) as zf:
              required = {
                  "fabric.mod.json",
                  "assets/travelerstitles/lang/en_us.json",
                  "assets/travelerstitles/lang/fr_fr.json",
                  "data/travelerstitles/tags/worldgen/biome/is_underground.json",
                  "pack.mcmeta",
              }
              missing = required.difference(zf.namelist())
              assert not missing, f"Jar is missing required resources: {sorted(missing)}"

              jar_en = json.loads(zf.read("assets/travelerstitles/lang/en_us.json"))
              jar_fr = json.loads(zf.read("assets/travelerstitles/lang/fr_fr.json"))
              assert set(jar_en) == set(jar_fr), "Built jar lost French translation parity"
              for biome in vanilla_biomes:
                  name_key = f"travelerstitles.biome.minecraft.{biome}"
                  color_key = f"{name_key}.color"
                  assert name_key not in jar_en and name_key not in jar_fr
                  assert jar_en[color_key] == jar_fr[color_key]


          ui_source = (root / "Fabric/src/main/java/com/yungnickyoung/minecraft/travelerstitles/config/ConfigBiomesFabric.java").read_text(encoding="utf-8")
          baker_source = (root / "Fabric/src/main/java/com/yungnickyoung/minecraft/travelerstitles/module/ConfigModuleFabric.java").read_text(encoding="utf-8")
          icon_option = "text.autoconfig.travelerstitles-fabric-26_1.option.biomes.showBiomeIcons"
          assert icon_option in en and icon_option in fr
          assert icon_option + ".@Tooltip" in en and icon_option + ".@Tooltip" in fr
          assert "public boolean showBiomeIcons = true;" in ui_source
          assert "CONFIG.biomes.showBiomeIcons = configFabric.biomes.showBiomeIcons;" in baker_source

          for group in ("biomes", "dimensions"):
              transition_key = f"text.autoconfig.travelerstitles-fabric-26_1.option.{group}.animateTitleTransitions"
              for locale in (en, fr):
                  assert transition_key in locale and transition_key + ".@Tooltip" in locale
              config_file = root / f"Fabric/src/main/java/com/yungnickyoung/minecraft/travelerstitles/config/Config{group.capitalize()}Fabric.java"
              assert "public boolean animateTitleTransitions = true;" in config_file.read_text(encoding="utf-8")
          config_baker = (root / "Fabric/src/main/java/com/yungnickyoung/minecraft/travelerstitles/module/ConfigModuleFabric.java").read_text(encoding="utf-8")
          assert "CONFIG.biomes.animateTitleTransitions = configFabric.biomes.animateTitleTransitions;" in config_baker
          assert "CONFIG.dimensions.animateTitleTransitions = configFabric.dimensions.animateTitleTransitions;" in config_baker
          renderer_source = (root / "Common/src/main/java/com/yungnickyoung/minecraft/travelerstitles/render/TitleRenderer.java").read_text(encoding="utf-8")
          assert "TitleTransition.sample(" in renderer_source
          assert "guiGraphics.pose().translate(0f, transition.offsetY());" in renderer_source
          assert "guiGraphics.pose().scale(transition.scale(), transition.scale());" in renderer_source

          # The old PUA font is deliberately replaced by a full-colour HUD
          # texture atlas. Validate exact order and source/compiled resources.
          import re
          import struct
          atlas_file = root / "Common/src/main/resources/assets/travelerstitles/textures/gui/biome_thumbnails.png"
          java_file = root / "Common/src/main/java/com/yungnickyoung/minecraft/travelerstitles/render/BiomeThumbnails.java"
          renderer_file = root / "Common/src/main/java/com/yungnickyoung/minecraft/travelerstitles/render/TitleRenderer.java"
          manager_file = root / "Common/src/main/java/com/yungnickyoung/minecraft/travelerstitles/render/TitleRenderManager.java"
          source = java_file.read_text(encoding="utf-8")
          match = re.search(r"BIOME_IDS = List.of\((.*?)\);", source, re.S)
          assert match, "Missing thumbnail biome lookup"
          ids = re.findall(r'"([a-z_]+)"', match.group(1))
          assert len(ids) == len(set(ids)) == 67
          assert set(ids) == vanilla_biomes, set(ids) ^ vanilla_biomes
          png = atlas_file.read_bytes()
          assert png.startswith(b"\x89PNG\r\n\x1a\n")
          assert struct.unpack(">II", png[16:24]) == (160, 180), "Expected 8x9 framed 20px pixel-art atlas"
          assert "RenderPipelines.GUI_TEXTURED" in renderer_file.read_text(encoding="utf-8")
          assert "BiomeThumbnails.indexFor(biomeBaseKey, biomeTitle)" in manager_file.read_text(encoding="utf-8")
          with zipfile.ZipFile(jar) as zf:
              assert "assets/travelerstitles/textures/gui/biome_thumbnails.png" in zf.namelist()
              assert zf.read("assets/travelerstitles/textures/gui/biome_thumbnails.png") == png
              assert "assets/travelerstitles/font/biome_icons.json" not in zf.namelist()
              assert "assets/travelerstitles/textures/font/biome_icons.png" not in zf.namelist()
              assert any(name.endswith("/BiomeThumbnails.class") for name in zf.namelist())
              assert not any(name.endswith("/BiomeIcons.class") for name in zf.namelist())
          print("Validated 67 full-color biome thumbnails + modded-biome fallback.")
          
          import os
          mod_meta = json.loads(zipfile.ZipFile(jar).read("fabric.mod.json"))
          expected_version = f"26.3-Fabric-{os.environ['FORK_VERSION']}"
          assert mod_meta["version"] == expected_version, (mod_meta["version"], expected_version)
          assert os.environ["FORK_VERSION"] in jar.name, jar.name
          print(f"Validated unique fork version: {expected_version}")

          print(f"Validated {len(en)} EN/FR keys and production jar: {jar}")
          PY

      - name: Install software OpenGL for client smoke test
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri libglx-mesa0 mesa-utils

      - name: Bootstrap-test Fabric client
        shell: bash
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
          GALLIUM_DRIVER: llvmpipe
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          ALSOFT_DRIVERS: "null"
        run: |
          set +e
          timeout 75s xvfb-run -a -s "-screen 0 1280x720x24 +extension GLX +render -noreset" \
            ./gradlew -Pversion="${FORK_VERSION}" :Fabric:runClient --no-daemon --stacktrace > fabric-client-smoke.log 2>&1
          code=$?
          set -e

          cat fabric-client-smoke.log

          LOG="Fabric/runs/client/logs/latest.log"
          if [ ! -f "$LOG" ]; then
            echo "Minecraft latest.log was not created."
            exit 1
          fi

          if grep -Eqi "Mixin apply failed|EntrypointException|ModResolutionException|Exception in thread|Crash report saved to|Could not execute entrypoint" "$LOG"; then
            echo "Fatal Traveler's Titles/Fabric runtime error detected."
            cat "$LOG"
            exit 1
          fi

          if ! grep -Fq "travelerstitles 26.3-Fabric-6.2.0" "$LOG"; then
            echo "Traveler's Titles was not loaded by Fabric."
            cat "$LOG"
            exit 1
          fi

          # GitHub's Ubuntu runners are headless. Minecraft 26.3/SDL3 can reject
          # Xvfb's GLX/Vulkan visuals even with Mesa llvmpipe. That is a runner
          # graphics limitation, not a mod bootstrap failure. Treat it explicitly
          # while still failing on any mod/mixin/entrypoint error above.
          if grep -Fq "Failed to create backend OpenGL" "$LOG" && grep -Fq "Failed to create backend Vulkan" "$LOG"; then
            if ! grep -Fq "Couldn't find matching GLX visual" "$LOG"; then
              echo "Unexpected OpenGL backend failure."
              cat "$LOG"
              exit 1
            fi
            echo "Traveler's Titles loaded successfully; graphical continuation is unavailable on this headless runner."
            exit 0
          fi

          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Fabric client exited unexpectedly with code $code"
            cat "$LOG"
            exit "$code"
          fi

          if ! grep -Eqi "Reloading ResourceManager|OpenAL initialized|Sound engine started" "$LOG"; then
            echo "Minecraft did not reach resource/sound initialization."
            cat "$LOG"
            exit 1
          fi

          echo "Fabric 26.3 client startup smoke-test passed with a working graphics backend."

      - name: Upload Fabric jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TravelersTitles-26.3-Fabric
          path: |
            Fabric/build/libs/*.jar
            !Fabric/build/libs/*-sources.jar
            !Fabric/build/libs/*-javadoc.jar
          if-no-files-found: error
