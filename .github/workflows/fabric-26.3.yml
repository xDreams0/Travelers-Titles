name: Fabric 26.3

on:
  push:
    branches:
      - "26.3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Verify Gradle
        run: ./gradlew --version

      - name: Build Fabric mod
        run: ./gradlew :Fabric:build --stacktrace --warning-mode all

      - name: Smoke-test Fabric client startup
        shell: bash
        run: |
          set +e
          timeout 120s xvfb-run -a ./gradlew :Fabric:runClient --no-daemon --stacktrace > fabric-client-smoke.log 2>&1
          code=$?
          set -e

          cat fabric-client-smoke.log

          if [ "$code" -ne 0 ] && [ "$code" -ne 124 ]; then
            echo "Fabric client exited unexpectedly with code $code"
            exit "$code"
          fi

          LOG="Fabric/runs/client/logs/latest.log"
          if [ ! -f "$LOG" ]; then
            echo "Minecraft latest.log was not created."
            exit 1
          fi

          if grep -Eqi "Mixin apply failed|EntrypointException|ModResolutionException|Exception in thread|Crash report saved to|Could not execute entrypoint" "$LOG"; then
            echo "Fatal mod/runtime error detected."
            cat "$LOG"
            exit 1
          fi

          if ! grep -Eqi "Backend library|Reloading ResourceManager|OpenAL initialized|Setting user" "$LOG"; then
            echo "Minecraft did not reach a recognizable client startup stage."
            cat "$LOG"
            exit 1
          fi

          echo "Fabric 26.3 client startup smoke-test passed."

      - name: Upload Fabric jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: TravelersTitles-26.3-Fabric
          path: |
            Fabric/build/libs/*.jar
            !Fabric/build/libs/*-sources.jar
            !Fabric/build/libs/*-javadoc.jar
          if-no-files-found: error
